<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C38"/>
      <stop offset="50%" stop-color="#253560"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2A38"/>
      <stop offset="50%" stop-color="#3F4155"/>
      <stop offset="100%" stop-color="#2A2A38"/>
    </linearGradient>
  </defs>
  <!-- Screen bezel -->
  <rect x="35" y="10" width="130" height="78" rx="6" fill="#181822" stroke="#4A4A62" stroke-width="2"/>
  <!-- Display with cyan ambient glow -->
  <rect x="42" y="16" width="116" height="66" rx="3" fill="url(#screenGrad)"/>
  <!-- Lenovo LOQ Logo text -->
  <text x="100" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="3">LOQ</text>
  <!-- Base keyboard deck -->
  <path d="M15 90 L35 88 L165 88 L185 90 L175 104 L25 104 Z" fill="url(#baseGrad)" stroke="#55556E" stroke-width="1.5"/>
  <!-- Trackpad indent -->
  <rect x="85" y="93" width="30" height="8" rx="2" fill="#1C1C28" stroke="#00D4FF" stroke-width="0.8"/>
  <!-- Blue power glow bar -->
  <line x1="75" y1="89" x2="125" y2="89" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
