<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="tufScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1124"/>
      <stop offset="50%" stop-color="#4B1E38"/>
      <stop offset="100%" stop-color="#FF3377"/>
    </linearGradient>
    <linearGradient id="tufBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#201E28"/>
      <stop offset="50%" stop-color="#3A3845"/>
      <stop offset="100%" stop-color="#201E28"/>
    </linearGradient>
  </defs>
  <!-- Screen bezel -->
  <rect x="35" y="10" width="130" height="78" rx="6" fill="#14141E" stroke="#5C344E" stroke-width="2"/>
  <!-- Display with magenta gaming glow -->
  <rect x="42" y="16" width="116" height="66" rx="3" fill="url(#tufScreen)"/>
  <!-- ASUS TUF Logo text -->
  <text x="100" y="52" fill="#FF88AA" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">TUF GAMING</text>
  <!-- Base keyboard deck -->
  <path d="M15 90 L35 88 L165 88 L185 90 L175 104 L25 104 Z" fill="url(#tufBase)" stroke="#6E445B" stroke-width="1.5"/>
  <!-- RGB Underglow -->
  <rect x="85" y="93" width="30" height="8" rx="2" fill="#1A1822" stroke="#FF3377" stroke-width="0.8"/>
  <line x1="75" y1="89" x2="125" y2="89" stroke="#FF3377" stroke-width="1.5" stroke-linecap="round"/>
</svg>
