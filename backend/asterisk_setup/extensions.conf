; backend/asterisk_setup/extensions.conf
; Dialplan for Jack AI Call Answering Gateway
; When a forwarded call arrives on the trunk, Asterisk answers and bridges to Jack AI

[general]
static=yes
writeprotect=no

[from-carrier]
; Incoming forwarded call context
exten => _X.,1,NoOp(Incoming Forwarded Call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 ; Streams bi-directional audio to Jack Free AI Server AudioSocket
 same => n,AudioSocket(jack-free-ai-uuid,localhost:8000)
 same => n,Hangup()

exten => s,1,NoOp(Incoming Forwarded Call Without DID)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AudioSocket(jack-free-ai-uuid,localhost:8000)
 same => n,Hangup()
