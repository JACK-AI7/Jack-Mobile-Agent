; backend/asterisk_setup/pjsip.conf
; PJSIP Configuration for Jack AI Telephony

[global]
type=global
user_agent=Jack-AI-OpenSource-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Example: Inbound Trunk for Free SIP Provider (e.g. Callcentric / Local PBX)
[inbound-trunk]
type=endpoint
context=from-carrier
disallow=all
allow=ulaw
allow=alaw
allow=opus
dtmf_mode=rfc4733
direct_media=no

[inbound-trunk-identify]
type=identify
endpoint=inbound-trunk
match=0.0.0.0/0
