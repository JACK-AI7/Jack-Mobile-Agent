name: jack
description: "Jack - Multi-Modal AI Mobile Agent."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  web_socket_channel: ^3.0.3
  dio: ^5.11.0
  path_provider: ^2.1.6
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # ── Voice & Speech ──────────────────────────────────────────────────────────
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  # ── Permissions ─────────────────────────────────────────────────────────────
  permission_handler: ^13.0.0

  # ── Storage / File access ────────────────────────────────────────────────────
  path: ^1.9.1

  # ── Networking utils ─────────────────────────────────────────────────────────
  http: ^1.2.2
  # For streaming SSE responses
  dio_smart_retry: ^6.0.0

  # ── Local AI / ML ────────────────────────────────────────────────────────────
  # (Removed heavy ML packages that require extra native setup — Groq handles all AI)

  # ── UI enhancements ──────────────────────────────────────────────────────────
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  workmanager: ^0.10.9
  installed_apps: ^2.1.1
  sensors_plus: ^7.1.0
  flutter_secure_storage: ^11.2.0
  socket_io_client: ^3.1.6
  flutter_accessibility_service: ^1.2.0
  flutter_svg: ^2.0.17
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/glow.frag

  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
